# Trusted shell configuration; only root should be able to modify this file.

# Logical interface from /etc/config/network, NOT a device such as eth0.
INTERFACE='wan'

# Local DNS on this router, standard DNS port 53, IPv4 transport.
# Use the router's LAN address instead if DNS is not listening on loopback.
DNS_SERVER='127.0.0.1'

# auto: prefer dig when available, otherwise use BusyBox nslookup.
# Set to 'dig' or 'nslookup' to select the client explicitly.
DNS_CLIENT='auto'

# Choose independently hosted names with working A records in your network.
DOMAINS='openwrt.org www.cloudflare.com www.wikipedia.org'
QUERY_TYPE='A'

# Start a round every 15 seconds when queries finish within that interval.
# Three sequential queries, each bounded to 3 seconds.
CHECK_INTERVAL=15
QUERY_TIMEOUT=3

# Last 4 complete rounds = 12 queries. Strictly greater than 75%:
# 9/12 failures does NOT trigger, 10/12 does.
WINDOW_ROUNDS=4
ERROR_THRESHOLD=75

# At most one action every 5 minutes, including failed recovery attempts.
# Do not restart while the current round is fully successful.
COOLDOWN=300
STARTUP_DELAY=60
SETTLE_TIME=30

# SAFE DEFAULT: log "would restart" without changing any interface.
# Change to 0 only after checking diagnostics and logs.
DRY_RUN=1

# Optional cache-busting probe, ONLY with your own remotely hosted wildcard:
# *.dnscheck.your-domain.tld must resolve to a valid A (or AAAA) record.
# DOMAINS='openwrt.org www.cloudflare.com {nonce}.dnscheck.your-domain.tld'
# Do not enable this example without configuring and testing that DNS zone.
